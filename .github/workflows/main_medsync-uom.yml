
name: Deploy MedSync to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medsync-azure-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies and build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm install
          npm run build

      - name: Prepare standalone deployment
        run: |
          test -f .next/standalone/server.js
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/
          if [ -d public ]; then
            cp -r public .next/standalone/
          fi

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: medsync-standalone
          path: .next/standalone/
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: medsync-standalone

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C0D8241520AC4A77BC5DF538A4433823 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F54F1A7FE8A8493990295FB56FFD4E72 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6CFDDD2E67294666B9DB8281F7D5B73A }}

      - name: Verify deployment artifact
        run: |
          test -f server.js
          test -f .next/BUILD_ID
          test -f .next/server/app/register.html

          echo "Deploying Next.js build:"
          cat .next/BUILD_ID
          echo

          grep -Fq "Patient accounts create" \
            .next/server/app/register.html

      - name: Create deployment ZIP
        run: |
          zip -qr "$RUNNER_TEMP/medsync.zip" .

          unzip -l "$RUNNER_TEMP/medsync.zip" \
            | grep -E 'server.js|BUILD_ID' | head -10

      - name: Deploy clean build to Azure
        run: |
          az webapp deploy \
            --resource-group medsync-rg \
            --name medsync-uom \
            --src-path "$RUNNER_TEMP/medsync.zip" \
            --type zip \
            --clean true \
            --restart true \
            --timeout 600000

      - name: Verify live deployment
        run: |
          URL="https://medsync-uom-ewephsdhgzcedhax.indiasouthcentral-01.azurewebsites.net/register"

          for attempt in $(seq 1 15); do
            if curl -fsS "$URL" | grep -Fq "Patient accounts create"; then
              echo "SUCCESS: New registration page is live!"
              exit 0
            fi

            echo "Waiting for new version ($attempt/15)..."
            sleep 10
          done

          echo "FAILED: Azure is still serving an unexpected version."
          exit 1
