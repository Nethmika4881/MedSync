
name: Deploy MedSync to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medsync-azure-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies and build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm install
          npm run build

      - name: Prepare standalone deployment
        run: |
          test -f .next/standalone/server.js
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/
          if [ -d public ]; then
            cp -r public .next/standalone/
          fi

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: medsync-standalone
          path: .next/standalone/
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: medsync-standalone

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C0D8241520AC4A77BC5DF538A4433823 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F54F1A7FE8A8493990295FB56FFD4E72 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6CFDDD2E67294666B9DB8281F7D5B73A }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: medsync-uom
          slot-name: Production
          package: .
